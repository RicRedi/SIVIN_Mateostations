name: CI

on:
  push:
    branches: ["main", "wp/**", "claude/**"]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: lint, type, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev,ingest,viz]"
      - name: Gates
        run: make lint type test PY=python

  workflows:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install actionlint
        run: python -m pip install "actionlint-py==1.7.12.25"
      - name: Lint the workflows (with shellcheck of the runner image)
        run: actionlint
